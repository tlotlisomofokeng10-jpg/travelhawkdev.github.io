<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-key="downloadPageTitle">TravelHawk - Download the App</title>
    <link rel="icon" type="image/png" href="../favicon.png">

    <!-- Global Vanilla CSS Design System -->
    <link rel="stylesheet" href="../global.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .download-box {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 1.5rem;
            max-width: 500px;
            margin: 0 auto;
            color: white;
            box-shadow: var(--shadow-xl);
            display: inline-block;
        }

        html.dark .download-box {
            background: rgba(2, 6, 23, 0.6);
            border-color: rgba(255, 255, 255, 0.05);
        }
    </style>

    <script>
        // --- DEVICE DETECTION & REDIRECT ---
        (function () {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // iOS Detection
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.href = "https://apps.apple.com/za/app/crimehawk/id6584519575";
            }
            // Android Detection
            else if (/android/i.test(userAgent)) {
                window.location.href = "https://play.google.com/store/apps/details?id=com.skeeptechnologies.crimehawk";
            }
        })();

        // Set theme on initial load
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>

<body class="flex flex-col min-h-screen">

    <!-- Header & Navigation -->
    <header style="position: absolute; width: 100%;">
        <div class="container flex justify-between items-center py-4">
            <a href="../" class="flex items-center space-x-2">
                <img src="../Untitled%20design%20(9).png" alt="TravelHawk Logo" class="w-10 h-10">
                <span class="text-2xl font-bold text-slate-800 dark:text-white">TravelHawk</span>
            </a>
            <div class="flex items-center space-x-4">
                <nav class="hidden md:flex items-center space-x-8">
                    <a href="../#home" class="nav-link" data-i18n-key="navHome">Home</a>
                    <a href="../contact/" class="nav-link" data-i18n-key="navContact">Contact</a>
                </nav>
                <div class="relative">
                    <select id="language-selector"></select>
                </div>
                <button id="theme-toggle" class="nav-link">
                    <i data-lucide="sun" class="w-6 h-6 hidden dark:inline"></i>
                    <i data-lucide="moon" class="w-6 h-6 dark:hidden"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="hero-bg flex-grow flex items-center justify-center">
        <div class="container text-center">
            <div class="download-box">
                <img src="../Untitled%20design%20(9).png" alt="TravelHawk Logo" class="w-24 h-24 mx-auto mb-6">
                <h1 class="text-4xl font-extrabold mb-4 text-white" data-i18n-key="downloadHeroTitle">Download TravelHawk</h1>
                <p class="text-lg text-slate-200 mb-8 max-w-xs mx-auto" data-i18n-key="downloadHeroSubtitle">Your personal safety companion for exploring South Africa.</p>

                <div class="flex flex-col md:flex-row gap-4 justify-center items-center">
                    <a href="https://apps.apple.com/za/app/crimehawk/id6584519575" target="_blank" rel="noopener noreferrer" class="magnetic-button">
                        <span class="magnetic-content">
                            <img src="../app-store-badge.svg" alt="Download on the App Store" class="h-16">
                        </span>
                    </a>
                    <a href="https://play.google.com/store/apps/details?id=com.skeeptechnologies.crimehawk" target="_blank" rel="noopener noreferrer" class="magnetic-button">
                        <span class="magnetic-content">
                            <img src="../google-play-badge.png" alt="Get it on Google Play" class="h-[84px]">
                        </span>
                    </a>
                </div>
                <div class="mt-8">
                    <a href="../" class="text-slate-300 hover:text-white underline underline-offset-4 text-sm font-medium transition-colors" data-i18n-key="backToWebsite">Back to Website</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-8">
        <div class="container text-center">
            <p class="text-sm" data-i18n-key="footerProductOf">A product of Skeep Technologies (Pty) Ltd.</p>
            <p class="text-sm mt-2" data-i18n-key="footerCopyright">&copy; 2025 TravelHawk. All rights reserved.</p>
        </div>
    </footer>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            // --- THEME TOGGLE LOGIC ---
            const themeToggleBtn = document.getElementById('theme-toggle');
            const htmlEl = document.documentElement;

            themeToggleBtn.addEventListener('click', () => {
                if (htmlEl.classList.contains('dark')) {
                    htmlEl.classList.remove('dark');
                    localStorage.theme = 'light';
                } else {
                    htmlEl.classList.add('dark');
                    localStorage.theme = 'dark';
                }
            });

            // --- MAGNETIC BUTTONS ---
            document.querySelectorAll('.magnetic-button').forEach(button => {
                const content = button.querySelector('.magnetic-content');
                button.addEventListener('mousemove', function (e) {
                    const { offsetX, offsetY, target } = e;
                    const { clientWidth, clientHeight } = target;
                    const rect = target.getBoundingClientRect();
                    const x = ((e.clientX - rect.left) / clientWidth - 0.5) * 20;
                    const y = ((e.clientY - rect.top) / clientHeight - 0.5) * 20;

                    if (content) content.style.transform = `translate(${x}px, ${y}px)`;
                });
                button.addEventListener('mouseleave', function (e) {
                    if (content) content.style.transform = 'translate(0, 0)';
                });
            });

            // --- LOCALIZATION SCRIPT ---
            const translations = {
                'ar': 'Arabic', 'zh': 'Chinese', 'nl': 'Dutch', 'en': 'English', 'fr': 'French',
                'de': 'German', 'hi': 'Hindi', 'it': 'Italian', 'ja': 'Japanese', 'ko': 'Korean',
                'pt': 'Portuguese', 'ru': 'Russian', 'es': 'Spanish', 'sv': 'Swedish', 'th': 'Thai'
            };

            const languageSelector = document.getElementById('language-selector');

            for (const langCode in translations) {
                const option = document.createElement('option');
                option.value = langCode;
                option.textContent = translations[langCode];
                languageSelector.appendChild(option);
            }

            async function loadLanguage(lang) {
                try {
                    const response = await fetch(`../translations/${lang}.json?v=${Date.now()}`);
                    if (!response.ok) return;
                    const data = await response.json();
                    document.querySelectorAll('[data-i18n-key]').forEach(el => {
                        const key = el.getAttribute('data-i18n-key');
                        if (data[key]) {
                            el.innerHTML = data[key];
                        }
                    });
                    document.documentElement.lang = lang;
                    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                } catch (e) {
                    console.error("Failed to load language", e);
                }
            }

            languageSelector.addEventListener('change', (e) => {
                localStorage.setItem('language', e.target.value);
                loadLanguage(e.target.value);
            });

            const savedLang = localStorage.getItem('language') || navigator.language.split('-')[0];
            if (translations[savedLang]) {
                languageSelector.value = savedLang;
                loadLanguage(savedLang);
            } else {
                languageSelector.value = 'en';
            }
        });
    </script>
</body>

</html>
